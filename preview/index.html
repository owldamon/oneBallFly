<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>一球飞升 · 物理沙盒</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; }
    html, body { width: 100%; height: 100%; background: #0b0e14; overflow: hidden; font-family: system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; }
    #hud {
      width: min(100vw, 420px); color: #e8ecf4; display: flex; justify-content: space-between;
      padding: 0 8px; font-size: 14px; letter-spacing: 0.02em;
    }
    #stage {
      position: relative; width: min(100vw, 420px); height: min(calc(100vh - 72px), 747px);
      background: #141a24; border: 1px solid #2a3344; border-radius: 8px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      display: none; position: absolute; inset: 0; background: rgba(8,10,16,0.82);
      color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { font-size: 28px; font-weight: 600; }
    button {
      border: 0; border-radius: 8px; padding: 10px 18px; background: #5b8cff; color: #fff;
      font-size: 15px; cursor: pointer;
    }
    #hint { width: min(100vw, 420px); color: #8b95a8; font-size: 12px; padding: 0 8px; text-align: center; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span id="lives">魂 3</span>
      <span id="status">上拉发射 · 左右按住挡板</span>
    </div>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="overlay"><h1>阵停了</h1><button id="restart">再入一次</button></div>
    </div>
    <div id="hint">左 40% / 右 40% 按住抬扉 · 底部上拉发射 · 掉沟 -1 魂</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
